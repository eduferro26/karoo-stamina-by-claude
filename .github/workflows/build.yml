name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Gradle 8.9 instalado por la acción: no hace falta tener el wrapper en el repo.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Tests del modelo y APK de depuración
        env:
          # karoo-ext está en GitHub Packages, que exige autenticación.
          # Crea el secreto GPR_TOKEN (PAT con read:packages); si no existe se prueba con GITHUB_TOKEN.
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: karoo-stamina-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir informes de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
